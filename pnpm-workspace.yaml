packages:
  - packages/*
  - apps/*
  - examples/*

# Names declared by two or more workspace package.json files.
catalog:
  "@effect/ai-anthropic": 4.0.0-rc.113
  "@effect/platform-node": 4.0.0-rc.113
  "@types/react": 19.3.0
  "@types/react-dom": 19.3.0
  "@vitejs/plugin-react": 5.2.0
  effect: 4.0.0-rc.113
  jev-use: 0.7.1
  playwright: 1.63.0
  react: 19.3.0
  react-dom: 19.3.0
  tinyglobby: 0.2.17
  tsdown: 0.23.0
  tsx: 4.23.13
  typescript: 7.0.2
  vite: 7.3.6
  vitest: 5.0.0
  yaml: 2.9.0

onlyBuiltDependencies:
  - esbuild
  - "@esbuild/linux-x64"
  # lefthook's postinstall is what installs the git hooks into .git/hooks. Without this entry pnpm
  # skips it silently on 10.x and hard-errors on 12.x (ERR_PNPM_IGNORED_BUILDS), so CI would fail
  # on install. The script is CI-aware and no-ops when $CI is set.
  - lefthook
